# Model registry — the single source of truth for WHICH model serves WHICH task.
#
# This file declares only what cannot be measured from an artefact: a model's
# identity, the task it answers, whether the serving path is allowed to use it,
# and the requirements it places on its input. Everything else -- whether the
# checkpoint exists, its fingerprint, its class list, its metrics, when it was
# written -- is read from disk by src/registry/model_registry.py at load time,
# because a copy written down here would go stale the moment a model is
# retrained. That is the same rule Phase 14 applied to /api/system-info.
#
# `serves` is deliberately explicit rather than inferred from "a checkpoint
# exists". A trained model is not automatically a servable one: the two defect
# models below were trained on defects this project painted, and listing them
# with serves: [] is how the platform refuses to answer a real-world defect
# question it has no real-world evidence for.
#
# Adding a model: add an entry here. Do not add a checkpoint path to a loader.

version: 1

# Canonical task names. A task with no serving model is answered "unavailable",
# never approximated with a model trained for something else.
tasks:
  detect:              Locate and count individual kernels in an image.
  variety:             Name the maize variety of a single kernel.
  quality:             Grade a single kernel Good or Bad.
  distribution_gate:   Decide whether a grade is interpolation or extrapolation.
  embedding:           Produce the feature vector used for similarity search.
  defect_segmentation: Produce a pixel mask of the defective region.
  defect_pattern:      Name the visible defect pattern on a kernel.
  foreign_object_flag: Flag an object as unlike known maize. Never names what it is.
  visible_symptom:     Name the visible condition category a grader would assign a kernel.

models:
  - key: detection
    name: Seed detection
    version: 1.0.0
    architecture: YOLOv8n
    task: detect
    serves: [detect]
    role: "Locates and counts individual kernels (single class: Corn)."
    checkpoint: detection_corn/weights/best.pt
    metrics: detection
    dataset: dataset_3_detection
    trained_by: python -m src.training.train_detection
    input:
      kind: image
      image_size: 640
      colour: RGB
    # No resolution floor is declared: detection degrades gradually with size and
    # no floor has been measured for it. Only segmentation has a measured floor.
    requires_resolution: null

  - key: unified_seed_model
    name: Variety + kernel quality
    version: 1.0.0
    architecture: EfficientNet-B0 + cognitive attention, two heads
    task: variety
    serves: [variety, quality, embedding]
    role: One pass produces the variety prediction and the Good/Bad grade.
    checkpoint: unified_seed_model_best.pt
    metrics: unified_seed_model
    dataset: manifest_unified
    trained_by: >-
      python -m src.training.train_unified --encoder
      outputs/checkpoints/contrastive_encoder_unified_unified.pt
    input:
      kind: kernel_crop
      image_size: 224
      colour: RGB
    requires_resolution: null

  - key: contrastive_encoder
    name: Contrastive pretraining
    version: 1.0.0
    architecture: SimCLR / NT-Xent
    task: embedding
    serves: []
    role: Initialises the unified model's backbone; not served on its own.
    checkpoint: contrastive_encoder_unified_unified.pt
    metrics: null
    dataset: manifest_unified_pretrain
    trained_by: python -m src.training.pretrain_contrastive --dataset unified
    input:
      kind: kernel_crop
      image_size: 224
      colour: RGB
    requires_resolution: null

  - key: quality_gate
    name: Quality distribution gate
    version: 1.0.0
    architecture: kNN cosine distance to the training feature bank
    task: distribution_gate
    serves: [distribution_gate]
    role: >-
      Marks grades on imagery unlike the training data as unverified instead of
      reporting them as defects.
    checkpoint: quality_reference.npz
    metrics: quality_gate_comparison
    dataset: manifest_dataset_4_quality
    trained_by: python -m src.analysis.build_quality_reference
    input:
      kind: embedding
      dim: 1280
    requires_resolution: null

  - key: maize_identity_gate
    name: Foreign object flagging gate
    version: 2.0.0
    architecture: >-
      kNN cosine distance to a maize-wide reference of detector crops, minus a
      quadratic-in-log(crop px) size term fitted on held-out maize. Two limits of
      applicability -- a 21px resolution floor and a 16-object scene limit --
      return unavailable rather than a score
    task: foreign_object_flag
    serves: [foreign_object_flag]
    role: >-
      A RANKED REVIEW AID, not a detector. It scores how unlike known maize a
      detected object looks and marks the most unlike for a human to inspect. It
      does not identify the object: no stone, husk, cob-fragment or debris labels
      exist in this project, so the verdict is flagging and never classification.
      At the shipped 5% review budget it surfaces 6.5-9.0% of held-out maize and
      finds 69.8% of the impurities the detector located; the detector itself
      fires on 74.2% of impurity images, so end-to-end recall is about 51.8% and
      the absence of a flag is not evidence that an object is maize.
    checkpoint: maize_reference.npz
    metrics: maize_gate_comparison
    dataset: manifest_unified
    label_provenance: >-
      No foreign-object labels were used to fit anything. The threshold and the
      size correction are both fitted on held-out maize alone; GrainSet
      impurities are used only to measure the resulting catch rate, so that rate
      is a measurement rather than a fit.
    trained_by: python -m src.analysis.build_maize_reference
    input:
      kind: embedding
      dim: 1280
    requires_resolution: null

  - key: visible_symptom_classifier
    name: Visible symptom classifier
    version: 1.0.0
    architecture: >-
      EfficientNet-B0 + cognitive attention, 7 classes, fine-tuned end to end on
      GrainSpace condition labels, with a two-part abstention gate -- five
      validated classes and a 0.55 softmax floor
    task: visible_symptom
    serves: [visible_symptom]
    role: >-
      Reproduces the VISIBLE CONDITION CATEGORY a GrainSpace grader assigned to a
      kernel. It describes appearance, never aetiology: FM is the grader category
      "fusarium & mildew" and a prediction of FM is not a fusarium diagnosis, and
      nothing here identifies a pathogen, a toxin or a species. Gated, it names a
      category for 56.9% of held-out kernels and is correct on 76.9% of those;
      the other 43.1% are returned as withheld, not guessed.
    checkpoint: symptom_classifier_finetune_best.pt
    metrics: symptom_classifier_finetune
    dataset: manifest_symptom
    label_provenance: >-
      GrainSpace M600 val split -- expert grader condition directories, used as
      given. Real maize KERNEL imagery: no synthetic damage, no propagated
      labels, and no maize leaf-disease dataset standing in for kernels. The
      1,260 labelled crops are the entire supply available to this project, since
      the GrainSpace train half is organised by cultivar and carries no condition
      annotation at all.
    trained_by: >-
      python -m src.training.train_symptom --stage finetune --epochs 30 --lr 0.0001
      && python -m src.analysis.calibrate_symptom
    input:
      kind: kernel_crop
      image_size: 224
      colour: RGB
    # Two of the seven classes are never asserted. HD holds 9 validation crops and
    # SD holds 2, which is below the support at which an operating point can be
    # measured, so when either wins the argmax the answer is withheld rather than
    # reported. They are listed here because a served model's silences are part of
    # its specification.
    withheld_classes: [HD, SD]
    requires_resolution: null

  - key: variety_a_full
    name: Variety model A (ablation)
    version: 1.0.0
    architecture: EfficientNet-B0 + cognitive attention, 3 classes
    task: variety
    serves: []
    role: >-
      Superseded by the unified model. Kept reachable so the
      contrastive/attention ablation stays reproducible.
    checkpoint: variety_a_full_best.pt
    metrics: variety_a_full
    dataset: manifest_dataset_a
    trained_by: python -m src.training.train_variety --dataset a --experiment full
    input:
      kind: kernel_crop
      image_size: 224
      colour: RGB
    requires_resolution: null

  - key: variety_b_full_grouped
    name: Variety model B (ablation)
    version: 1.0.0
    architecture: EfficientNet-B0 + cognitive attention, 3 classes
    task: variety
    serves: []
    role: >-
      Superseded by the unified model. Group-aware splits; kept for the same
      ablation.
    checkpoint: variety_b_full_grouped_best.pt
    metrics: variety_b_full_grouped
    dataset: manifest_dataset_b_grouped
    trained_by: python -m src.training.train_variety --dataset b_grouped --experiment full
    input:
      kind: kernel_crop
      image_size: 224
      colour: RGB
    requires_resolution: null

  - key: synthetic_defect_classifier
    name: Synthetic defect classifier
    version: 1.0.0
    architecture: EfficientNet-B0 + cognitive attention, 4 classes
    task: defect_pattern
    serves: []
    label_provenance: synthetic
    role: >-
      Trained on defects this project painted. Demonstration only, disabled in
      the serving path, never a real-world result.
    checkpoint: synthetic_defect_classifier_best.pt
    metrics: synthetic_defect
    dataset: manifest_synthetic_defects
    trained_by: python -m src.training.train_synthetic_defect
    input:
      kind: kernel_crop
      image_size: 224
      colour: RGB
    requires_resolution: null

  - key: defect_segmenter_synthetic
    name: Defect segmenter (synthetic)
    version: 1.0.0
    architecture: EfficientNet-B0 encoder + U-Net decoder
    task: defect_segmentation
    serves: []
    label_provenance: synthetic
    role: >-
      Trained on painted defects. Establishes the resolution floor only; it is
      not evidence about real defects and is not served.
    checkpoint: defect_segmenter_synthetic_best.pt
    metrics: defect_segmenter_synthetic
    dataset: manifest_segmentation_synthetic
    trained_by: >-
      python -m src.segmentation.train_seg --manifest
      data_processed/manifest_segmentation_synthetic.csv --out-name
      defect_segmenter_synthetic
    input:
      kind: kernel_crop
      image_size: 224
      colour: RGB
    # Measured, not guessed: outputs/metrics/segmentation_resolution_floor.json.
    # Below 24px of kernel a mask cannot be produced honestly, so Phase 8 refuses
    # rather than returning a low-confidence one.
    requires_resolution:
      min_kernel_px: 24
      source: outputs/metrics/segmentation_resolution_floor.json
